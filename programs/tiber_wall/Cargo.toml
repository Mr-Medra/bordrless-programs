[package]
name = "tiber-wall"
description = "The Wall: the Romulus and Remus token hook. No wallet may hold more than 1.5% of a twin, and only ordinary wallets and the twins' own accounts may hold one."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "tiber_wall"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "tiber-hook/idl-build", "tiber-token/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
solana-security-txt = { workspace = true }
anchor-lang = { workspace = true }
tiber-hook = { path = "../../crates/tiber-hook" }
tiber-token = { path = "../tiber_token", features = ["no-entrypoint"] }

[lints]
workspace = true
